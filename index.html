<style>
  html, body, #mapa { height: 100%; margin: 0; padding: 0; }
  body { background: #d4dadc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .legenda {
    background: rgba(255, 255, 255, 0.94);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 8px 10px;
    color: #1f2933;
    font-size: 13px;
    line-height: 1.5;
  }
  .legenda .item { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .legenda svg { flex: none; }
  .legenda .data { color: #5f6b76; font-size: 11px; margin-top: 4px; }

  /* Popup — mesmo desenho do popup de boia do maregrafos-map (nome, local, chips, linhas). */
  .leaflet-popup-content { margin: 10px 14px; font-family: inherit; color: #1f2933; }
  .popup .titulo { font-weight: 700; font-size: 14px; line-height: 1.3; padding-right: 10px; }
  .popup .local { color: #5f6b76; font-size: 12px; margin-top: 2px; }
  .popup .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .popup .chip { font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 12px; }
  .popup .chip.ativa { background: #0b5a2a; color: #ffffff; }
  .popup .chip.inativa { background: #d03b3b; color: #ffffff; }
  .popup .chip.programa { border: 1px solid #9aa5b1; color: #1f2933; padding: 4px 8px; }
  .popup .linha { font-size: 12px; line-height: 1.65; }
  .popup .linha span { color: #5f6b76; }
</style>

  // ---- Regras ---------------------------------------------------------------
  // Estações com buoy_id acima deste valor (bancadas de teste) são ignoradas.
  var BUOY_ID_MAX = 100;

  // mode -> "ativa" | "inativa" | "oculta". Modos fora da lista caem em MODO_PADRAO.
  var CATEGORIA_POR_MODO = {
    FUNDEADA:   "ativa",
    INOPERANTE: "inativa",
    MANUTENCAO: "inativa",
    DERIVA:     "inativa",
    DERIVANDO:  "inativa",
    TESTES:     "oculta"
    // GAP, LANCAMENTO -> MODO_PADRAO (inativa)
  };
  var MODO_PADRAO = "inativa";

  // ---- Aparência ------------------------------------------------------------
  var ESTILO = {
    PNBOIA:  { radius: 7, color: "#ffffff", weight: 1.5, fillColor: "#0b5a2a", fillOpacity: 1 },
    REMOBS:  { radius: 7, color: "#1e6b33", weight: 1.5, fillColor: "#4cb860", fillOpacity: 1 },
    inativa: { radius: 5.5, color: "#d03b3b", weight: 3.5, fillColor: "#ffffff", fillOpacity: 1 }
  };

  function categoria(e) {
    if (e.id > BUOY_ID_MAX) return "oculta";
    if (e.latitude == null || e.longitude == null) return "oculta";
    var c = CATEGORIA_POR_MODO[(e.mode || "").toUpperCase()] || MODO_PADRAO;
    if (c !== "ativa") return c;
    return (e.project || "").toUpperCase() === "PNBOIA" ? "PNBOIA" : "REMOBS";
  }

  // Mesmo critério do maregrafos-map (MooredBuoysLayer); o resto (AXYS, BMOBR, METOCEAN…) usa o pino AXYS.
  function tipoPino(e) {
    var t = (e.buoy_type || "").toLowerCase();
    if (t.indexOf("spotter") >= 0) return "spotter";
    if (t.indexOf("triaxys") >= 0) return "triaxys";
    if (t.indexOf("criosfera") >= 0) return "criosfera";
    return "axys";
  }

  var PINO_ALTURA = 32;
  function iconePino(tipo, cat) {
    var ic = ICONES[tipo + "_" + cat];
    var largura = Math.round(PINO_ALTURA * ic.w / ic.h);
    return L.icon({
      iconUrl: ic.src,
      iconSize: [largura, PINO_ALTURA],
      iconAnchor: [largura / 2, PINO_ALTURA],  // ponta do pino na posição da estação
      popupAnchor: [0, -PINO_ALTURA + 2]       // popup abre acima do pino, não sobre ele
    });
  }

  // ---- Popup ----------------------------------------------------------------
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function dois(n) { return (n < 10 ? "0" : "") + n; }
  function fmtData(ymd) {  // "2025-09-22" -> "22/09/2025"
    var p = /^(\d{4})-(\d{2})-(\d{2})/.exec(ymd || "");
    return p ? p[3] + "/" + p[2] + "/" + p[1] : null;
  }
  function fmtDataHoraUtc(iso) {  // "2026-10-05T14:21:40Z" -> "05/10/2026 14:21 UTC"
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d.getTime())) return null;
    return dois(d.getUTCDate()) + "/" + dois(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear() + " " +
      dois(d.getUTCHours()) + ":" + dois(d.getUTCMinutes()) + " UTC";
  }
  function linha(rotulo, valor) {
    return '<div class="linha"><span>' + rotulo + ':</span> ' + esc(valor == null ? "n/d" : valor) + "</div>";
  }
  function conteudoPopup(e, cat) {
    var ativa = cat !== "inativa";
    var programa = (e.project || "").toUpperCase() === "PNBOIA" ? "PNBOIA" : "REMObs";
    var pos = Number(e.latitude).toFixed(4) + ", " + Number(e.longitude).toFixed(4);
    return '<div class="popup">' +
      '<div class="titulo">' + esc(e.name || "Estação " + e.id) + "</div>" +
      (e.local ? '<div class="local">' + esc(e.local) + "</div>" : "") +
      '<div class="chips"><span class="chip ' + (ativa ? "ativa" : "inativa") + '">' + (ativa ? "Ativa" : "Inativa") +
      '</span><span class="chip programa">' + programa + "</span></div>" +
      linha("Último dado", fmtDataHoraUtc(e.last_date_time)) +
      linha("Posição (lat, lon)", pos) +
      linha("Lançamento", fmtData(e.deploy_date)) +
      linha("Profundidade", e.water_depth != null ? e.water_depth + " m" : null) +
      linha("ID da estação", e.id) +
      "</div>";
  }
  var OPCOES_POPUP = { maxWidth: 300, minWidth: 220 };

  // ---- Mapa -----------------------------------------------------------------
  var mapa = L.map("mapa", { minZoom: 2, maxZoom: 10, worldCopyJump: true });
  mapa.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 10,
    attribution: "Esri, Garmin, GEBCO, NOAA NGDC e outros"
  }).addTo(mapa);

  // Inativas primeiro, para que as ativas fiquem por cima quando houver sobreposição.
  var ordem = { inativa: 0, REMOBS: 1, PNBOIA: 2 };
  var camada = L.layerGroup().addTo(mapa);

  function desenhar(estacoes, enquadrar) {
    camada.clearLayers();
    var limites = [];
    estacoes
      .map(function (e) { return { e: e, c: categoria(e) }; })
      .filter(function (x) { return x.c !== "oculta"; })
      .sort(function (a, b) { return ordem[a.c] - ordem[b.c]; })
      .forEach(function (x) {
        var ll = [Number(x.e.latitude), Number(x.e.longitude)];
        var marcador = MARCADOR === "pino"
          ? L.marker(ll, {
              icon: iconePino(tipoPino(x.e), x.c),
              alt: x.e.name || "Estação " + x.e.id,
              zIndexOffset: 1000 * ordem[x.c]  // marcadores são empilhados por latitude; ativas sempre por cima
            })
          : L.circleMarker(ll, ESTILO[x.c]);
        marcador.bindPopup(conteudoPopup(x.e, x.c), OPCOES_POPUP).addTo(camada);
        if (ll[0] > -45) limites.push(ll);  // enquadramento inicial na costa; Antártica fica a um zoom de distância
      });
    if (!enquadrar) return;
    if (limites.length) mapa.fitBounds(limites, { paddingTopLeft: [30, 45], paddingBottomRight: [30, 30] });
    else mapa.setView([-15, -40], 4);
  }

  desenhar(ESTACOES, true);

  // ---- Legenda --------------------------------------------------------------
  function simbolo(cat) {
    if (MARCADOR === "pino") {
      var ic = ICONES["axys_" + cat], h = 22, w = Math.round(h * ic.w / ic.h);
      return '<img src="' + ic.src + '" width="' + w + '" height="' + h + '" alt="">';
    }
    var s = ESTILO[cat], r = s.radius, w = s.weight, d = Math.ceil(2 * r + w + 2);
    return '<svg width="' + d + '" height="' + d + '" aria-hidden="true"><circle cx="' + d / 2 + '" cy="' + d / 2 +
      '" r="' + r + '" fill="' + s.fillColor + '" stroke="' + s.color + '" stroke-width="' + w + '"/></svg>';
  }
  var legenda = L.control({ position: "bottomleft" });
  legenda.onAdd = function () {
    var div = L.DomUtil.create("div", "legenda");
    div.innerHTML =
      '<div class="item">' + simbolo("PNBOIA") + '<span>PNBOIA — ativa</span></div>' +
      '<div class="item">' + simbolo("REMOBS") + '<span>REMObs — ativa</span></div>' +
      '<div class="item">' + simbolo("inativa") + '<span>Inativa</span></div>' +
      '<div class="data" id="atualizado"></div>';
    return div;
  };
  legenda.addTo(mapa);

  // Com "?diag" no endereço, o rodapé da legenda diz de onde vieram os dados (teste no site da Marinha).
  var DIAG = /[?&]diag\b/.test(window.location.search);
  function rodape(data, fonte) {
    document.getElementById("atualizado").textContent =
      "Atualizado em " + data + (DIAG ? " · fonte: " + fonte : "");
  }
  rodape(GERADO_EM, "cópia embutida (buscando API…)");

  // ---- Dados ao vivo --------------------------------------------------------
  var controle = window.AbortController ? new AbortController() : null;
  var relogio = controle && setTimeout(function () { controle.abort(); }, TEMPO_LIMITE_MS);
  fetch(FONTE_AO_VIVO, controle ? { signal: controle.signal } : {})
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (estacoes) {
      if (!Array.isArray(estacoes) || !estacoes.length) throw new Error("resposta vazia");
      desenhar(estacoes, false);
      var agora = new Date().toLocaleString("pt-BR", {
        timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
      rodape(agora, "API ao vivo");
    })
    .catch(function (erro) {
      rodape(GERADO_EM, "cópia embutida — API indisponível (" + (erro && erro.name === "AbortError" ? "tempo esgotado" : erro) + ")");
      if (window.console) console.warn("pnboia-mapa: usando cópia embutida;", erro);
    })
    .then(function () { if (relogio) clearTimeout(relogio); });
})();
